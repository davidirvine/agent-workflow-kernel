name: CI

on:
  push:
  pull_request:

# Cancel superseded in-progress runs for the same ref (e.g. rapid pushes or PR
# synchronize events) so redundant CI is not left running. Triggers stay on
# both push and pull_request per the dev-gates spec.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    name: lint / format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # shfmt is not preinstalled on ubuntu-latest (shellcheck is). Pin the
      # exact version that scripts/checks.sh and slice 4's setup.sh expect —
      # different shfmt versions can format differently, so the pin keeps CI
      # and local formatting deterministic.
      - name: Install shfmt v3.8.0
        env:
          # sha256 of shfmt_v3.8.0_linux_amd64 from the upstream release
          # checksums (sha256sums.txt). Verify the download so a tampered or
          # MITM'd binary cannot silently alter CI.
          SHFMT_SHA256: 27b3c6f9d9592fc5b4856c341d1ff2c88856709b9e76469313642a1d7b558fe0
        run: |
          curl -fsSL -o shfmt https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64
          echo "${SHFMT_SHA256}  shfmt" | sha256sum -c -
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/shfmt
          shfmt --version

      - run: npm ci

      - name: Run shared checks (parity with pre-push)
        run: scripts/checks.sh

  # Slice-2 gates (a) + (b): manifest-validate + schema-independent
  # identity-leak denylist (design D7). Both checks live in scripts/ so they
  # ship downstream via sync-kernel.sh; this job just invokes them. No
  # node_modules install needed — both are pure bash with jq.
  preset-leak-check:
    name: preset-leak-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest validate
        run: scripts/check-manifest.sh

      - name: Identity-leak denylist
        run: scripts/check-identity-leak.sh

  # Slice-2 gate (d): the preset is a self-contained buildable unit
  # (preset-portability spec). FAUST is provisioned via the @grame/faustwasm
  # npm dep (design D10) — no system FAUST install is needed and none is added
  # here (D7's kernel-dep-posture rule: kernel root stays minimal, preset
  # self-contains). The job also runs the preset's own prettier check and the
  # traveling chassis-purity test (task 9.1).
  preset-build:
    name: preset-build (svelte-faust-synth)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presets/svelte-faust-synth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: presets/svelte-faust-synth/package-lock.json

      - run: npm ci

      - name: Lint / format check (preset's own prettier with Svelte plugin)
        run: npm run lint

      - name: Build (FAUST prebuild + Vite)
        run: npm run build

      - name: Traveling chassis-purity test
        run: npx vitest run src/chassis-purity.test.js

      - name: Power-off-silence vitest
        run: npx vitest run src/power-off-silence.test.js

  # Slice-3 gate (design D9): run new-app.sh into a tempdir and assert the
  # emitted tree structurally + by identity (scripts/generate-assert.sh). Node
  # from .nvmrc is needed for the generator's `node -e` JSON edits; jq, git, and
  # rsync are preinstalled on ubuntu-latest, and generate-assert provides a
  # headless git identity for the scaffold commit. No FAUST and no app build
  # here — the emitted app is only built in slice 5's smoke-app.
  #
  # Slice-4 (design D9) extends this same gate: generate-assert.sh now also runs
  # the sync round-trip on the emitted app — positive (sync --dry-run reports
  # "up to date"), negative (a bumped kernel copy + a locally-edited file makes
  # sync refuse with the conflict named), and --accept-kernel resolution. The
  # steps live inside generate-assert.sh so they run identically here and
  # locally; nothing new is needed in this job beyond the rsync/jq the runner
  # already provides. Per design D7 NO setup-check job is added — setup.sh
  # --check is for humans + downstream consumers; the kernel's CI provisions its
  # prereqs explicitly via the install steps above.
  generate-assert:
    name: generate-assert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generate an app and assert the emitted tree + sync round-trip
        run: scripts/generate-assert.sh

  # Pending stub (D4): present and green from day one so the harness slot
  # exists in every CI run. Slices 3-5 fill in real pipeline stages by
  # editing this one job rather than adding new ones. Slice 2 deliberately
  # does NOT touch this stub (task 10.4).
  smoke-app:
    name: smoke-app
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "smoke-app: pending until slice 5"'
