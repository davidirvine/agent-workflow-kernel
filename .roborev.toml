agent = "claude-code"
# Reviews run only at the explicit gates (see CLAUDE.md "Code review with
# roborev"), never automatically per commit. That posture is enforced by the
# no-op .githooks/post-commit stub (auto-review is hook-driven; the stub
# enqueues nothing), NOT by this config: post_commit_review is omitted because
# it is a review-type string with no disabling value — it cannot turn auto-review
# off (see WORKFLOW-NOTES.md "roborev queueing is hook-driven").
auto_close_passing_reviews = true
